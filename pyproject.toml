[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analise-eleitoral-sp"
version = "0.3.0"
description = "Votação de Enrico Misasi e Reinaldo Alguz e emendas de 2019–2022"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4"]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11"]

[project.scripts]
analise-eleitoral = "eleitoral.cli:main"

[tool.setuptools]
packages = ["eleitoral"]
